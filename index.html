<body>
    <button id="backButton" class="back-arrow" title="Previous logo" aria-label="Show previous club" disabled>←</button>

    <div class="site">
        <h1>Random Football Club Logo</h1>
        
        <div id="result" class="result" style="display: none;">
            <div class="logo-wrapper">
                <img id="clubLogo" alt="" width="300" height="300" decoding="async">
            </div>
            <p id="clubName"></p>
        </div>
        
        <button id="randomButton">GO</button>
    </div>

    <div id="historyDots" class="history-dots" aria-label="Recently viewed clubs"></div>
    <button id="feedbackBtn" class="feedback-button" title="Report an error" aria-label="Report an error">!</button>

    <div id="feedbackModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle" hidden>
        <div class="modal-content">
            <button type="button" class="close" aria-label="Close feedback form">&times;</button>
            <h2 id="feedbackTitle">Report an Error</h2>
            <p>If the logo doesn't match the club, let us know:</p>
            <form id="feedbackForm" action="https://formspree.io/f/xojrevay" method="POST">
                <input type="hidden" id="feedbackClub" name="club">
                <textarea id="feedbackText" name="message" placeholder="E.g.: Barcelona logo shows Real Madrid..." required></textarea>
                <button type="submit" id="sendFeedback">Send</button>
            </form>
            <p id="feedbackStatus" role="status" aria-live="polite"></p>
        </div>
    </div>

    <noscript><p class="noscript">JavaScript is required to show random club logos.</p></noscript>

    <script src="script.js?v=2"></script>
</body>
</html>
